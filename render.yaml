services:
  - type: web
    name: nexveda-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: sqlite
      - key: CONTACT_EMAIL
        value: nexvedatechnologies@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: nexvedatechnologies@gmail.com
      - key: SMTP_PASS
        sync: false
